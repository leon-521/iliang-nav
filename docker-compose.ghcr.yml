services:
  nav:
    image: ghcr.io/leon-521/iliang-nav:${ILIANG_NAV_IMAGE_TAG:-v0.1.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/app.db
      ICON_DIR: /app/data/icons
      ILIANG_AI_SETTINGS_PATH: /app/data/ai/provider.json
      WEBDAV_SETTINGS_DIR: /app/data/webdav-settings
    volumes:
      - ./data:/app/data
